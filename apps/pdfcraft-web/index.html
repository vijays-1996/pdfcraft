<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f1f3" />
    <meta name="theme-color" content="#19191c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PdfCraft" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="../../assets/app-icon/hicolor/512x512/apps/ai.storyteller.pdfcraft.png" />
    <link rel="icon" href="./ai.storyteller.pdfcraft.png" />
    <link rel="apple-touch-icon" href="./ai.storyteller.pdfcraft.png" />
    <title>PdfCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Recognises text off the page's thread (crates/ui-egui/src/workflows/ocr_web.rs). -->
    <link data-trunk rel="rust" href="../pdfcraft-ocr-worker/Cargo.toml" data-type="worker" data-loader-shim data-bindgen-target="web" data-wasm-opt="3" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f1f1f3;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
